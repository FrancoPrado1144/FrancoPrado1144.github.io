<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="Diagrama de flujo del entrenamiento DQN" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<title>Diagrama de flujo del entrenamiento DQN</title>
<defs>
  <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#a855f7"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="469" rx="14" fill="#09090b" stroke="#27272a"/>
<text x="32" y="44" font-size="20" fill="#f4f4f5" font-weight="600" text-anchor="start">Ciclo de entrenamiento (Double DQN)</text>
<text x="32" y="68" font-size="13" fill="#a1a1aa" font-weight="400" text-anchor="start">Se repite en cada paso de la simulación, durante 4.000 episodios</text>
<rect x="40" y="100" width="262" height="104" rx="12" fill="#141417" stroke="#27272a"/>
<circle cx="66" cy="128" r="13" fill="#a855f7"/>
<text x="66" y="133" font-size="13" fill="#0a0a0a" font-weight="700" text-anchor="middle">1</text>
<text x="88" y="133" font-size="16" fill="#f4f4f5" font-weight="600" text-anchor="start">Observar</text>
<text x="58" y="164" font-size="12.5" fill="#a1a1aa" font-weight="400" text-anchor="start">El dron lee sus sensores:</text>
<text x="58" y="183" font-size="12.5" fill="#a1a1aa" font-weight="400" text-anchor="start">estado, rayos y vector al señuelo</text>
<rect x="349" y="100" width="262" height="104" rx="12" fill="#141417" stroke="#27272a"/>
<circle cx="375" cy="128" r="13" fill="#a855f7"/>
<text x="375" y="133" font-size="13" fill="#0a0a0a" font-weight="700" text-anchor="middle">2</text>
<text x="397" y="133" font-size="16" fill="#f4f4f5" font-weight="600" text-anchor="start">Elegir acción</text>
<text x="367" y="164" font-size="12.5" fill="#a1a1aa" font-weight="400" text-anchor="start">Con probabilidad ε explora al azar;</text>
<text x="367" y="183" font-size="12.5" fill="#a1a1aa" font-weight="400" text-anchor="start">si no, elige la de mayor valor Q</text>
<rect x="658" y="100" width="262" height="104" rx="12" fill="#141417" stroke="#27272a"/>
<circle cx="684" cy="128" r="13" fill="#a855f7"/>
<text x="684" y="133" font-size="13" fill="#0a0a0a" font-weight="700" text-anchor="middle">3</text>
<text x="706" y="133" font-size="16" fill="#f4f4f5" font-weight="600" text-anchor="start">Simular</text>
<text x="676" y="164" font-size="12.5" fill="#a1a1aa" font-weight="400" text-anchor="start">PyBullet aplica la acción</text>
<text x="676" y="183" font-size="12.5" fill="#a1a1aa" font-weight="400" text-anchor="start">y avanza la física un paso</text>
<rect x="658" y="290" width="262" height="104" rx="12" fill="#141417" stroke="#27272a"/>
<circle cx="684" cy="318" r="13" fill="#a855f7"/>
<text x="684" y="323" font-size="13" fill="#0a0a0a" font-weight="700" text-anchor="middle">4</text>
<text x="706" y="323" font-size="16" fill="#f4f4f5" font-weight="600" text-anchor="start">Recompensa</text>
<text x="676" y="354" font-size="12.5" fill="#a1a1aa" font-weight="400" text-anchor="start">+ acercarse al objetivo</text>
<text x="676" y="373" font-size="12.5" fill="#a1a1aa" font-weight="400" text-anchor="start">− inclinarse, rozar o chocar edificios</text>
<rect x="349" y="290" width="262" height="104" rx="12" fill="#141417" stroke="#27272a"/>
<circle cx="375" cy="318" r="13" fill="#a855f7"/>
<text x="375" y="323" font-size="13" fill="#0a0a0a" font-weight="700" text-anchor="middle">5</text>
<text x="397" y="323" font-size="16" fill="#f4f4f5" font-weight="600" text-anchor="start">Guardar</text>
<text x="367" y="354" font-size="12.5" fill="#a1a1aa" font-weight="400" text-anchor="start">La transición va a una memoria</text>
<text x="367" y="373" font-size="12.5" fill="#a1a1aa" font-weight="400" text-anchor="start">de hasta 300.000 experiencias</text>
<rect x="40" y="290" width="262" height="104" rx="12" fill="#141417" stroke="#27272a"/>
<circle cx="66" cy="318" r="13" fill="#a855f7"/>
<text x="66" y="323" font-size="13" fill="#0a0a0a" font-weight="700" text-anchor="middle">6</text>
<text x="88" y="323" font-size="16" fill="#f4f4f5" font-weight="600" text-anchor="start">Aprender</text>
<text x="58" y="354" font-size="12.5" fill="#a1a1aa" font-weight="400" text-anchor="start">Lote al azar de 64 experiencias</text>
<text x="58" y="373" font-size="12.5" fill="#a1a1aa" font-weight="400" text-anchor="start">actualiza la red (γ = 0,99, Adam)</text>
<line x1="308" y1="152.0" x2="341" y2="152.0" stroke="#a855f7" stroke-width="2" fill="none" marker-end="url(#flecha)"/>
<line x1="617" y1="152.0" x2="650" y2="152.0" stroke="#a855f7" stroke-width="2" fill="none" marker-end="url(#flecha)"/>
<line x1="789.0" y1="210" x2="789.0" y2="282" stroke="#a855f7" stroke-width="2" fill="none" marker-end="url(#flecha)"/>
<line x1="652" y1="342.0" x2="619" y2="342.0" stroke="#a855f7" stroke-width="2" fill="none" marker-end="url(#flecha)"/>
<line x1="343" y1="342.0" x2="310" y2="342.0" stroke="#a855f7" stroke-width="2" fill="none" marker-end="url(#flecha)"/>
<line x1="171.0" y1="284" x2="171.0" y2="212" stroke="#a855f7" stroke-width="2" fill="none" marker-end="url(#flecha)"/>
<circle cx="44" cy="428" r="4" fill="#c084fc"/>
<text x="56" y="432" font-size="12.5" fill="#a1a1aa" font-weight="400" text-anchor="start">ε baja de 1,0 a 0,05 en los primeros 600 episodios</text>
<circle cx="530" cy="428" r="4" fill="#c084fc"/>
<text x="542" y="432" font-size="12.5" fill="#a1a1aa" font-weight="400" text-anchor="start">Cada 1.000 pasos la red se copia a la red objetivo</text>
</svg>
