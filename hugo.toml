baseURL = "https://francoprado1144.github.io/"
languageCode = "es-ar"
defaultContentLanguage = "es"
title = "Franco Prado | Ciencia de Datos e IA"
theme = "hugo-minimal-black"

# Enable search index generation and web app manifest
[outputs]
  home = ["HTML", "RSS", "JSON", "WebAppManifest"]

[outputFormats.WebAppManifest]
  mediaType = "application/manifest+json"
  rel = "manifest"
  baseName = "manifest"
  isPlainText = true
  notAlternative = true

[params]
  brand = "Franco Prado"
  description = "Portfolio de Franco Prado, estudiante de Ingeniería en Sistemas de Información (UTN FRC) orientado a ciencia de datos e inteligencia artificial."

  # Favicon - Place your favicon files in /static/ directory
  favicon = "icons/favicon.svg"
  appleTouchIcon = "apple-touch-icon.png"

  # Project and blog intro text
  projectsIntro = "Proyectos en los que trabajé, de la facultad y personales."
  blogIntro = ""

  # Web App Manifest Configuration (PWA support)
  [params.manifest]
    themeColor = "#a855f7"
    backgroundColor = "#000000"
    categories = ["portfolio", "developer"]

  # Theme Configuration
  [params.theme]
    defaultTheme = "dark"  # Options: "light", "dark", "system"

  # Home Page Configuration
  [params.home]
    sections = ["hero", "now", "tech-marquee", "projects"]
    showNowSection = true
    showFeaturedProjects = true
    showLatestPosts = false
    featuredProjectsLimit = 3
    latestPostsLimit = 3
    projectsTitle = "Proyectos destacados"
    projectsSubtitle = ""
    blogTitle = "Últimas publicaciones"
    blogSubtitle = ""
    techMarqueeLabel = "Tecnologías"

    # Technology Stack Display
    [[params.home.tech]]
      label = "Python"
      icon = "devicon-python-plain"

    [[params.home.tech]]
      label = "Pandas"
      icon = "devicon-pandas-plain"

    [[params.home.tech]]
      label = "Apache Spark"
      icon = "devicon-apachespark-original"

    [[params.home.tech]]
      label = "FastAPI"
      icon = "devicon-fastapi-plain"

    [[params.home.tech]]
      label = "Git"
      icon = "devicon-git-plain"

    [[params.home.techReverse]]
      label = "Java"
      icon = "devicon-java-plain"

    [[params.home.techReverse]]
      label = "Spring Boot"
      icon = "devicon-spring-plain"

    [[params.home.techReverse]]
      label = "Docker"
      icon = "devicon-docker-plain"

    [[params.home.techReverse]]
      label = "Postman"
      icon = "devicon-postman-plain"

    [[params.home.techReverse]]
      label = "C#"
      icon = "devicon-csharp-plain"

    [[params.home.tech]]
      label = "SQL"
      icon = "devicon-microsoftsqlserver-plain"

    [[params.home.tech]]
      label = "PL/SQL"
      icon = "devicon-oracle-original"

  # Hero Section Configuration
  [params.hero]
    badge = "Ing. en Sistemas · UTN FRC"
    title = "Hola, soy Franco Prado."
    role = "Estudiante de Ingeniería en Sistemas orientado a ciencia de datos e inteligencia artificial"
    summary = "Me interesa construir soluciones con datos: desde modelos de aprendizaje por refuerzo hasta APIs y pipelines de procesamiento. Trabajo con Python y Java, y hoy combino la facultad con la investigación y la docencia."
    # avatar = "images/avatar.jpg"  # Opcional: 400x400px recomendado (poner el archivo en /static/images/)
    location = "Córdoba, Argentina"
    focus = "Hoy enfocado en aprendizaje por refuerzo profundo y análisis de datos."
    available = true
    availableLabel = "Disponible para trabajar"

    nowLabel = "En este momento"
    nowIntro = "Actualmente estoy:"
    now = [
      "Cursando 4.º año de Ingeniería en Sistemas de Información en la UTN FRC",
      "Como becario de investigación en GISSIC y ayudante de cátedra de Probabilidad y Estadística",
      "Entrenando un dron con Deep Q-Learning para seguir objetivos en movimiento"
    ]

    [params.hero.primary]
      label = "Ver proyectos"
      href = "/projects/"

    [params.hero.secondary]
      label = "Sobre mí"
      href = "/about/"

  # Icon Libraries
  [params.icons]
    useFontAwesome = true
    useDevicon = true

  # Social Links
  [[params.social]]
    label = "GitHub"
    url = "https://github.com/FrancoPrado1144"
    icon = "fa-brands fa-github"

  [[params.social]]
    label = "LinkedIn"
    url = "https://www.linkedin.com/in/franco-prado"
    icon = "fa-brands fa-linkedin-in"

  [[params.social]]
    label = "Email"
    url = "mailto:francoprado2001@gmail.com"
    icon = "fa-regular fa-envelope"

# Navigation Menu
[menu]
  [[menu.main]]
    name = "Inicio"
    pageRef = "/"
    url = "/"
    weight = 1
    identifier = "home"
    [menu.main.params]
      icon = "fa-solid fa-house"

  [[menu.main]]
    name = "Sobre mí"
    pageRef = "about"
    url = "/about/"
    weight = 2
    identifier = "about"
    [menu.main.params]
      icon = "fa-regular fa-user"

  [[menu.main]]
    name = "Proyectos"
    pageRef = "projects"
    url = "/projects/"
    weight = 3
    identifier = "projects"
    [menu.main.params]
      icon = "fa-regular fa-folder-open"

# Markup Configuration
[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

  [markup.goldmark.renderer]
    unsafe = true

  [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true

  [markup.goldmark.extensions]
    typographer = true
    linkify = true
    table = true
    strikethrough = true
    taskList = true
    definitionList = true
    footnote = true

    [markup.goldmark.extensions.extras.delete]
      enable = true
    [markup.goldmark.extensions.extras.insert]
      enable = true
    [markup.goldmark.extensions.extras.mark]
      enable = true

  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    lineNumbersInTable = false
    noClasses = false
    style = "monokai"
    tabWidth = 2

# Taxonomies
[taxonomies]
  tag = "tags"
  category = "categories"

# Privacy Configuration
[privacy]
  [privacy.youtube]
    privacyEnhanced = true
